<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e63012"/>
      <stop offset="50%" stop-color="#ff6044"/>
      <stop offset="100%" stop-color="#e63012"/>
    </linearGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <!-- Glow filter for icon -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Left red edge accent -->
  <rect x="0" y="0" width="5" height="640" fill="#e63012"/>
  <!-- Bottom red edge accent -->
  <rect x="0" y="634" width="1280" height="6" fill="#e63012" opacity="0.4"/>

  <!-- ============================================================
       ICON: Clean geometric stopwatch — centered at x=370, y=300
       ============================================================ -->

  <!-- Outer ring -->
  <circle cx="370" cy="310" r="108" fill="none" stroke="#2a2a2a" stroke-width="6"/>
  <!-- Inner ring (face) -->
  <circle cx="370" cy="310" r="92" fill="#161616" stroke="#333333" stroke-width="1"/>

  <!-- Red arc — top-right quadrant, like a progress indicator -->
  <path d="M 370 218 A 92 92 0 0 1 462 310"
        fill="none" stroke="#e63012" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Tick marks — 12 positions -->
  <g stroke="#444444" stroke-width="2" stroke-linecap="round">
    <line x1="370" y1="224" x2="370" y2="236"/>
    <line x1="416" y1="237" x2="410" y2="247"/>
    <line x1="449" y1="270" x2="441" y2="276"/>
    <line x1="462" y1="310" x2="450" y2="310"/>
    <line x1="449" y1="350" x2="441" y2="344"/>
    <line x1="416" y1="383" x2="410" y2="373"/>
    <line x1="370" y1="396" x2="370" y2="384"/>
    <line x1="324" y1="383" x2="330" y2="373"/>
    <line x1="291" y1="350" x2="299" y2="344"/>
    <line x1="278" y1="310" x2="290" y2="310"/>
    <line x1="291" y1="270" x2="299" y2="276"/>
    <line x1="324" y1="237" x2="330" y2="247"/>
  </g>

  <!-- Hour hand — pointing to ~11 o'clock -->
  <line x1="370" y1="310" x2="338" y2="268"
        stroke="#cccccc" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute hand — pointing to ~2 o'clock (longer) -->
  <line x1="370" y1="310" x2="418" y2="270"
        stroke="#e63012" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center dot -->
  <circle cx="370" cy="310" r="7" fill="#e63012"/>
  <circle cx="370" cy="310" r="3" fill="#ffffff"/>

  <!-- Crown (top button) -->
  <rect x="358" y="196" width="24" height="10" rx="5" fill="#333333" stroke="#444444" stroke-width="1"/>
  <!-- Side button (right) -->
  <rect x="470" y="304" width="12" height="12" rx="3" fill="#333333" stroke="#444444" stroke-width="1"/>

  <!-- ============================================================
       WORDMARK: Timing:Hub
       ============================================================ -->

  <!-- "Timing" -->
  <text x="512" y="290"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="108" font-weight="800" letter-spacing="-4"
        fill="#f2f2f2">Timing</text>

  <!-- ":" accent -->
  <text x="835" y="290"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="108" font-weight="800"
        fill="#e63012">:</text>

  <!-- "Hub" -->
  <text x="862" y="290"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="108" font-weight="800" letter-spacing="-4"
        fill="#f2f2f2">Hub</text>

  <!-- Red underline -->
  <rect x="512" y="306" width="570" height="4" rx="2" fill="url(#redLine)"/>

  <!-- Tagline -->
  <text x="512" y="358"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400" letter-spacing="0.5"
        fill="#666666">Professionelle Live-Zeitnahme für klassische Motorsport-Veranstaltungen</text>

  <!-- Pills: Live · Browserbasiert · Ohne Installation -->
  <text x="512" y="400"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="600" letter-spacing="4"
        fill="#3a3a3a">LIVE  ·  BROWSERBASIERT  ·  OHNE INSTALLATION</text>

  <!-- Tech stack row -->
  <!-- Svelte -->
  <rect x="512" y="440" width="100" height="28" rx="14" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="562" y="459" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="700" fill="#FF3E00">SvelteKit</text>

  <!-- Fastify -->
  <rect x="624" y="440" width="90" height="28" rx="14" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="669" y="459" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="700" fill="#888888">Fastify</text>

  <!-- Go -->
  <rect x="726" y="440" width="64" height="28" rx="14" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="758" y="459" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="700" fill="#00ADD8">Go</text>

  <!-- PostgreSQL -->
  <rect x="802" y="440" width="106" height="28" rx="14" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1"/>
  <text x="855" y="459" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="700" fill="#4169E1">PostgreSQL</text>

  <!-- Domain -->
  <text x="1230" y="610" text-anchor="end"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" letter-spacing="1"
        fill="#2a2a2a">timinghub.de</text>

</svg>
