<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>

  <!-- Stopwatch body -->
  <circle cx="200" cy="224" r="130" fill="#181818" stroke="#2a2a2a" stroke-width="5"/>

  <!-- Red progress arc ~90° (12 o'clock to 3 o'clock) -->
  <path d="M 200 94 A 130 130 0 0 1 330 224"
        fill="none" stroke="#e63012" stroke-width="8"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- Tick marks -->
  <g stroke="#3a3a3a" stroke-width="2.5" stroke-linecap="round">
    <line x1="200" y1="100" x2="200" y2="116"/>
    <line x1="265" y1="119" x2="257" y2="133"/>
    <line x1="311" y1="165" x2="299" y2="173"/>
    <line x1="330" y1="224" x2="314" y2="224"/>
    <line x1="311" y1="283" x2="299" y2="275"/>
    <line x1="265" y1="329" x2="257" y2="315"/>
    <line x1="200" y1="348" x2="200" y2="332"/>
    <line x1="135" y1="329" x2="143" y2="315"/>
    <line x1="89"  y1="283" x2="101" y2="275"/>
    <line x1="70"  y1="224" x2="86"  y2="224"/>
    <line x1="89"  y1="165" x2="101" y2="173"/>
    <line x1="135" y1="119" x2="143" y2="133"/>
  </g>

  <!-- Hour hand — pointing ~10 o'clock -->
  <line x1="200" y1="224" x2="162" y2="176"
        stroke="#aaaaaa" stroke-width="5" stroke-linecap="round"/>

  <!-- Minute hand — pointing ~1 o'clock (red) -->
  <line x1="200" y1="224" x2="252" y2="160"
        stroke="#e63012" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center pivot -->
  <circle cx="200" cy="224" r="9" fill="#e63012"/>
  <circle cx="200" cy="224" r="4" fill="#ffffff"/>

  <!-- Crown (top button) -->
  <rect x="185" y="80" width="30" height="14" rx="7"
        fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Side button (right) -->
  <rect x="328" y="217" width="14" height="14" rx="4"
        fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- T:H monogram bottom -->
  <text x="200" y="390" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="800" letter-spacing="3"
        fill="#333333">T<tspan fill="#e63012">:</tspan>H</text>

</svg>
