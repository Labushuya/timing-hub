<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#111111"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <!-- Red gradient for accents -->
    <linearGradient id="redH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e63012"/>
      <stop offset="50%"  stop-color="#ff5c3a"/>
      <stop offset="100%" stop-color="#e63012"/>
    </linearGradient>

    <!-- Subtle glow on red elements -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Faint dot grid -->
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>

    <!-- Clip for left half (icon zone) -->
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="560" height="640"/>
    </clipPath>
  </defs>

  <!-- ── Background ──────────────────────────────────────────── -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Left red stripe -->
  <rect x="0" y="0" width="6" height="640" fill="#e63012"/>

  <!-- Subtle horizontal center line -->
  <line x1="560" y1="320" x2="1240" y2="320" stroke="#1e1e1e" stroke-width="1"/>

  <!-- ── STOPWATCH ICON — center: 300, 308 ─────────────────── -->

  <!-- Outer bezel ring -->
  <circle cx="300" cy="308" r="188" fill="#141414" stroke="#222222" stroke-width="3"/>

  <!-- Bezel texture ring -->
  <circle cx="300" cy="308" r="176" fill="none" stroke="#1c1c1c" stroke-width="8"/>

  <!-- Watch face -->
  <circle cx="300" cy="308" r="164" fill="#101010" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Inner dial ring (subtle) -->
  <circle cx="300" cy="308" r="148" fill="none" stroke="#181818" stroke-width="1"/>

  <!-- RED ARC — from 12 o'clock sweeping clockwise ~105° -->
  <path d="
    M 300 144
    A 164 164 0 0 1 458 391
  " fill="none" stroke="#e63012" stroke-width="9"
      stroke-linecap="round" filter="url(#redGlow)"/>

  <!-- ── Hour markers (12 positions) ── -->
  <!-- Long markers at 12, 3, 6, 9 -->
  <g stroke="#444444" stroke-linecap="round">
    <line x1="300" y1="150" x2="300" y2="172" stroke-width="4"/><!-- 12 -->
    <line x1="464" y1="308" x2="442" y2="308" stroke-width="4"/><!-- 3  -->
    <line x1="300" y1="466" x2="300" y2="444" stroke-width="4"/><!-- 6  -->
    <line x1="136" y1="308" x2="158" y2="308" stroke-width="4"/><!-- 9  -->
    <!-- Short markers -->
    <line x1="382" y1="168" x2="373" y2="183" stroke-width="2.5"/><!-- 1 -->
    <line x1="444" y1="230" x2="431" y2="239" stroke-width="2.5"/><!-- 2 -->
    <line x1="444" y1="386" x2="431" y2="377" stroke-width="2.5"/><!-- 4 -->
    <line x1="382" y1="448" x2="373" y2="433" stroke-width="2.5"/><!-- 5 -->
    <line x1="218" y1="448" x2="227" y2="433" stroke-width="2.5"/><!-- 7 -->
    <line x1="156" y1="386" x2="169" y2="377" stroke-width="2.5"/><!-- 8 -->
    <line x1="156" y1="230" x2="169" y2="239" stroke-width="2.5"/><!-- 10 -->
    <line x1="218" y1="168" x2="227" y2="183" stroke-width="2.5"/><!-- 11 -->
  </g>

  <!-- ── Hands ── -->
  <!-- Minute hand — pointing to ~1 (red, long) -->
  <line x1="300" y1="308"
        x2="370" y2="186"
        stroke="#e63012" stroke-width="6"
        stroke-linecap="round" filter="url(#redGlow)"/>

  <!-- Hour hand — pointing to ~10 (white-grey, shorter) -->
  <line x1="300" y1="308"
        x2="224" y2="228"
        stroke="#cccccc" stroke-width="5"
        stroke-linecap="round"/>

  <!-- Second hand — thin red line pointing to ~6 -->
  <line x1="300" y1="308"
        x2="300" y2="444"
        stroke="#e63012" stroke-width="2"
        stroke-linecap="round" opacity="0.7"/>
  <!-- Counterbalance -->
  <line x1="300" y1="308"
        x2="300" y2="276"
        stroke="#e63012" stroke-width="2"
        stroke-linecap="round" opacity="0.7"/>

  <!-- Center cap -->
  <circle cx="300" cy="308" r="11" fill="#e63012" filter="url(#redGlow)"/>
  <circle cx="300" cy="308" r="5"  fill="#ffffff"/>

  <!-- Crown (top winding button) -->
  <rect x="283" y="114" width="34" height="16" rx="8"
        fill="#252525" stroke="#333333" stroke-width="1.5"/>
  <rect x="289" y="110" width="22" height="8"  rx="4"
        fill="#1e1e1e" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Side pusher (right — lap button) -->
  <rect x="462" y="289" width="18" height="18" rx="5"
        fill="#252525" stroke="#333333" stroke-width="1.5"/>

  <!-- Sub-dial (small seconds) at 6 o'clock position -->
  <circle cx="300" cy="414" r="22" fill="#141414" stroke="#282828" stroke-width="1.5"/>
  <circle cx="300" cy="414" r="2"  fill="#555555"/>
  <line   x1="300" y1="414" x2="300" y2="396"
          stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ── WORDMARK right side ─────────────────────────────────── -->

  <!-- Eyebrow label -->
  <text x="632" y="218"
        font-family="'Helvetica Neue', HelveticaNeue, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="700" letter-spacing="8"
        fill="#e63012" opacity="0.9">MOTORSPORT-ZEITNAHME</text>

  <!-- Timing -->
  <text x="628" y="348"
        font-family="'Helvetica Neue', HelveticaNeue, Helvetica, Arial, sans-serif"
        font-size="118" font-weight="900" letter-spacing="-5"
        fill="#f0f0f0">Timing</text>

  <!-- : -->
  <text x="960" y="348"
        font-family="'Helvetica Neue', HelveticaNeue, Helvetica, Arial, sans-serif"
        font-size="118" font-weight="900"
        fill="#e63012" filter="url(#redGlow)">:</text>

  <!-- Hub -->
  <text x="989" y="348"
        font-family="'Helvetica Neue', HelveticaNeue, Helvetica, Arial, sans-serif"
        font-size="118" font-weight="900" letter-spacing="-5"
        fill="#f0f0f0">Hub</text>

  <!-- Underline -->
  <rect x="628" y="366" width="622" height="5" rx="2.5"
        fill="url(#redH)"/>

  <!-- Tagline -->
  <text x="628" y="416"
        font-family="'Helvetica Neue', HelveticaNeue, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="400" letter-spacing="0.3"
        fill="#555555">Live-Zeitnahme für klassische Motorsport-Veranstaltungen</text>

  <!-- Pills -->
  <text x="630" y="458"
        font-family="'Helvetica Neue', HelveticaNeue, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" letter-spacing="4.5"
        fill="#2e2e2e">LIVE  ·  BROWSERBASIERT  ·  OHNE INSTALLATION</text>

  <!-- Divider -->
  <line x1="628" y1="490" x2="990" y2="490" stroke="#202020" stroke-width="1"/>

  <!-- Tech stack -->
  <g font-family="'Helvetica Neue', HelveticaNeue, Helvetica, Arial, sans-serif"
     font-size="12" font-weight="700">

    <rect x="628" y="506" width="96"  height="26" rx="13" fill="#181818" stroke="#252525" stroke-width="1"/>
    <text x="676" y="524" text-anchor="middle" fill="#FF3E00">SvelteKit 2</text>

    <rect x="736" y="506" width="82"  height="26" rx="13" fill="#181818" stroke="#252525" stroke-width="1"/>
    <text x="777" y="524" text-anchor="middle" fill="#888888">Fastify 5</text>

    <rect x="830" y="506" width="56"  height="26" rx="13" fill="#181818" stroke="#252525" stroke-width="1"/>
    <text x="858" y="524" text-anchor="middle" fill="#00ADD8">Go 1.23</text>

    <rect x="898" y="506" width="96"  height="26" rx="13" fill="#181818" stroke="#252525" stroke-width="1"/>
    <text x="946" y="524" text-anchor="middle" fill="#4169E1">PostgreSQL</text>
  </g>

  <!-- Domain -->
  <text x="1244" y="612"
        text-anchor="end"
        font-family="'Helvetica Neue', HelveticaNeue, Helvetica, Arial, sans-serif"
        font-size="14" font-weight="500" letter-spacing="1"
        fill="#282828">timinghub.de</text>

  <!-- Bottom red edge -->
  <rect x="0" y="633" width="1280" height="7" fill="#e63012" opacity="0.35"/>

</svg>
