server {
    listen 80;
    server_name timinghub.de www.timinghub.de api.timinghub.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 200 "Timing Hub - SSL setup in progress";
        add_header Content-Type text/plain;
    }
}
