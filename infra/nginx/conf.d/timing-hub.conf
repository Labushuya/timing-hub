# HTTP: redirect to HTTPS + ACME challenges
server {
    listen 80;
    server_name timinghub.de www.timinghub.de api.timinghub.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: timinghub.de (SvelteKit Web App)
server {
    listen 443 ssl http2;
    server_name timinghub.de www.timinghub.de;

    ssl_certificate /etc/letsencrypt/live/timinghub.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timinghub.de/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/timinghub.de/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Service worker - never cache
    location = /sw.js {
        proxy_pass http://web:3000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Immutable static assets
    location /_app/immutable/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTPS: api.timinghub.de (Fastify API + WebSocket)
server {
    listen 443 ssl http2;
    server_name api.timinghub.de;

    ssl_certificate /etc/letsencrypt/live/timinghub.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timinghub.de/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/timinghub.de/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # WebSocket - must upgrade
    location /ws {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Auth routes - strict rate limit
    location ~ ^/v1/auth/(login|register) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # All other API routes
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
