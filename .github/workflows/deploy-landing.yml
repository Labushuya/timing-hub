name: Deploy Landing Page to Strato

# Runs automatically whenever landing/ files change on master push.
# No manual upload to Strato needed after this is set up.
#
# SETUP — add these 3 secrets in GitHub:
#   Repository → Settings → Secrets and variables → Actions → New repository secret
#
#   STRATO_FTP_HOST     Strato FTP hostname
#                       Find in Strato Kundenbereich → Hosting → FTP-Zugangsdaten
#                       Usually: ssh.strato.de  OR  ftp.stratoserver.net
#
#   STRATO_FTP_USER     FTP username (shown in Strato FTP settings)
#
#   STRATO_FTP_PASSWORD FTP password (same as your Strato login, or FTP-specific)
#
# After adding secrets, the next push that touches landing/ will trigger auto-deploy.

on:
  push:
    branches: [master]
    paths:
      - 'landing/**'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy-landing:
    name: Upload to Strato via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy landing/ to Strato root via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STRATO_FTP_HOST }}
          username: ${{ secrets.STRATO_FTP_USER }}
          password: ${{ secrets.STRATO_FTP_PASSWORD }}
          # Upload everything in landing/ to the FTP root (where index.html lives)
          local-dir: ./landing/
          server-dir: /
          # Exclude git internals and any local-only files
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/DEPLOY.md
