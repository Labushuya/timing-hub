name: Release Bridge

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            binary_suffix: ".exe"
            apt_packages: ""
          - goos: darwin
            goarch: arm64
            runner: ubuntu-latest
            binary_suffix: ""
            apt_packages: ""
          - goos: darwin
            goarch: amd64
            runner: ubuntu-latest
            binary_suffix: ""
            apt_packages: ""
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            binary_suffix: ""
            apt_packages: "libusb-dev"
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            binary_suffix: ""
            apt_packages: "libusb-dev gcc-aarch64-linux-gnu"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libusb (Linux targets)
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/bridge/go.sum

      - name: Build binary
        working-directory: apps/bridge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'linux' && '1' || '0' }}
          CC: ${{ matrix.goarch == 'arm64' && matrix.goos == 'linux' && 'aarch64-linux-gnu-gcc' || '' }}
        run: |
          BINARY_NAME="timy-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.binary_suffix }}"
          go build -ldflags="-s -w" -o "${BINARY_NAME}" .
          echo "BINARY_NAME=${BINARY_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: timy-bridge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apps/bridge/timy-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.binary_suffix }}
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum timy-bridge-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "timy-bridge ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/timy-bridge-windows-amd64.exe
            dist/timy-bridge-darwin-arm64
            dist/timy-bridge-darwin-amd64
            dist/timy-bridge-linux-amd64
            dist/timy-bridge-linux-arm64
            dist/SHA256SUMS
