name: Release Bridge

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            binary: dist/timy-bridge-windows-amd64.exe
            apt_packages: ""
            cgo_enabled: "0"
            cc: ""
          - goos: darwin
            goarch: arm64
            binary: dist/timy-bridge-darwin-arm64
            apt_packages: ""
            cgo_enabled: "0"
            cc: ""
          - goos: darwin
            goarch: amd64
            binary: dist/timy-bridge-darwin-amd64
            apt_packages: ""
            cgo_enabled: "0"
            cc: ""
          - goos: linux
            goarch: amd64
            binary: dist/timy-bridge-linux-amd64
            apt_packages: "libusb-dev"
            cgo_enabled: "1"
            cc: ""
          - goos: linux
            goarch: arm64
            binary: dist/timy-bridge-linux-arm64
            apt_packages: "libusb-dev gcc-aarch64-linux-gnu"
            cgo_enabled: "1"
            cc: "aarch64-linux-gnu-gcc"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git describe in Makefile

      - name: Install libusb (Linux targets)
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/bridge/go.sum

      - name: Build binary via Makefile
        working-directory: apps/bridge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          make build-ci OUTPUT=${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: timy-bridge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apps/bridge/${{ matrix.binary }}
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum timy-bridge-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "timy-bridge ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/timy-bridge-windows-amd64.exe
            dist/timy-bridge-darwin-arm64
            dist/timy-bridge-darwin-amd64
            dist/timy-bridge-linux-amd64
            dist/timy-bridge-linux-arm64
            dist/SHA256SUMS
